name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Testler yalnızca hafif bağımlılıklarla çalışır (torch/Docling gerekmez).
      - run: uv venv --python 3.12
      - run: uv pip install -r pyproject.toml --group dev
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/ruff check .

  image:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Production VPS x86_64: imaj yalnızca linux/amd64 için derlenir.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/dinlet-worker:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/dinlet-worker:latest
