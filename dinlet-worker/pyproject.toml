[project]
name = "dinlet-worker"
version = "0.1.0"
description = "Dinlet PDF metin çıkarma (Docling) ve Türkçe seslendirme (ema-lightning) worker'ı"
requires-python = ">=3.12,<3.14"
dependencies = [
  "bullmq>=3.3,<4",
  "boto3>=1.35",
]

[project.optional-dependencies]
# Ağır bağımlılıklar ayrı: normalizasyon testleri torch/Docling olmadan çalışır.
ml = [
  "docling[easyocr]>=2.135,<3",
  "pdfplumber>=0.11",
  "ema-lightning>=1.0.4,<2",
  "numpy>=1.24",
]

[tool.uv]
# Düz modüllerden oluşan bir uygulama; paket olarak kurulmaz.
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
